<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <meta name="description" content="Feyzay ürün detayları: renk ve beden seçenekleri, güvenli ödeme ve hızlı kargo ile alışverişin keyfini çıkarın.">
    <title>Ürün Detayı - Feyzay</title>
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <style>
        /* ============ DARK MODE & HEADER (Siyah Tema) ============ */
        body {
            margin: 0;
            padding: 0;
            background-color: #111 !important;
            color: #fff !important;
        }

        .babygiz-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #111;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid #222;
        }

        .top-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 8px 15px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-bottom: 1px solid #333;
        }

        .header-left {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .logo-feyzay {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #fff !important;
            text-decoration: none;
        }

        .header-right {
            flex: 2;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            padding: 10px 15px 10px 35px;
            border: 1px solid #444;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            width: 100%;
            min-width: 220px;
            transition: border-color 0.3s, background-color 0.3s;
            background: #222 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 12px center;
            color: #fff;
        }

        .search-input:focus {
            border-color: #fff;
            background-color: #111;
        }

        .navigation a,
        .navigation .user-menu-container {
            color: #fff !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .navigation a:hover {
            opacity: 0.7;
        }

        /* --- AÇILIR MENÜ (DROPDOWN) SİYAH TEMA DÜZELTMESİ --- */
        .dropdown-content {
            background-color: #222 !important;
        }

        .dropdown-content a {
            color: #fff !important;
            border-bottom: 1px solid #444 !important;
        }

        .dropdown-content a:hover {
            background-color: #333 !important;
            color: #fff !important;
        }

        .dropdown-content p {
            color: #aaa !important;
        }

        .header-nav {
            display: flex;
            justify-content: center;
            gap: 35px;
            padding: 15px 20px;
            background: #111;
            overflow-x: auto;
            white-space: nowrap;
        }

        .header-nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .header-nav a:hover {
            color: #fff;
        }

        /* ============ ÜRÜN DETAY SAYFASI (PDP) ============ */
        .pdp-body {
            background: #111;
        }

        /* Üst Menünün Altında Kalmaması İçin Padding Ayarı */
        .pdp-container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 180px 50px 100px;
            /* Header boşluğunu artırdık */
        }

        .pdp-breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8a8a8a;
            margin-bottom: 34px;
        }

        .pdp-breadcrumb a {
            color: #aaa;
            text-decoration: none;
            transition: color .15s;
        }

        .pdp-breadcrumb a:hover {
            color: #fff;
        }

        .pdp-breadcrumb .pdp-sep {
            color: #555;
        }

        .pdp-breadcrumb .pdp-current {
            color: #fff;
            font-weight: 600;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pdp-grid {
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr) 400px;
            gap: 30px;
            align-items: flex-start;
        }

        /* Sol Galeri Küçük Fotoları */
        .pdp-thumbs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 180px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .pdp-thumb {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #1a1a1a;
            border: 2px solid transparent;
            padding: 0;
            transition: border-color .18s ease, transform .18s ease;
            flex-shrink: 0;
        }

        .pdp-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pdp-thumb:hover {
            border-color: #666;
        }

        .pdp-thumb.active {
            border-color: #fff;
        }

        /* Ana Fotoğraf Alanı */
        .pdp-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a1a;
            cursor: zoom-in;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }

        .pdp-stage img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity .15s ease;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            backface-visibility: hidden;
        }

        /* Ana fotoğrafın sağında/solunda önceki-sonraki geçiş okları */
        .pdp-stage-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            transition: background .15s, transform .15s;
        }

        .pdp-stage-arrow:hover {
            background: rgba(0, 0, 0, .85);
            transform: translateY(-50%) scale(1.08);
        }

        .pdp-stage-prev {
            left: 14px;
        }

        .pdp-stage-next {
            right: 14px;
        }

        @media (max-width: 640px) {
            .pdp-stage-arrow {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
        }

        .pdp-zoom-hint {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(17, 17, 17, .85);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 20px;
            pointer-events: none;
        }

        .pdp-counter-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            pointer-events: none;
        }

        .pdp-stage.is-zoomed {
            cursor: zoom-out;
        }

        .pdp-expand-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: background .15s, transform .15s;
        }

        .pdp-expand-btn:hover {
            background: #111;
            transform: scale(1.06);
        }

        /* Sağ Bilgi Paneli */
        .pdp-info {
            position: sticky;
            top: 180px;
        }

        .pdp-eyebrow {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #8a8a8a;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .pdp-eyebrow:hover {
            color: #fff;
        }

        .pdp-title {
            font-size: 30px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 14px;
            letter-spacing: -.2px;
        }

        .pdp-price {
            font-size: 27px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .pdp-sku {
            font-size: 12px;
            color: #888;
            margin-bottom: 18px;
        }

        .pdp-stock {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 20px;
            margin-bottom: 26px;
        }

        .pdp-stock .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .pdp-stock.in {
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .pdp-stock.in .dot {
            background: #2ecc71;
        }

        .pdp-stock.out {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .pdp-stock.out .dot {
            background: #e74c3c;
        }

        .pdp-divider {
            height: 1px;
            background: #333;
            margin: 6px 0 24px;
        }

        .pdp-section-label {
            font-size: 12.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: #aaa;
            margin-bottom: 12px;
        }

        /* ====== YENİ: RENK SEÇİMİ İÇİN MİNİ FOTOĞRAFLAR ====== */
        .pdp-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 26px;
        }

        .pdp-color-swatch {
            position: relative;
            width: 55px;
            /* Daha dikdörtgen bir görünüm için */
            height: 75px;
            border-radius: 6px;
            border: 2px solid transparent;
            padding: 2px;
            cursor: pointer;
            background: none;
            transition: border-color .15s ease, transform .12s ease;
        }

        .pdp-color-swatch img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .pdp-color-swatch:hover {
            transform: scale(1.05);
        }

        .pdp-color-swatch.active {
            border-color: #fff;
        }

        .pdp-selected-color-label {
            font-weight: 500;
            color: #fff;
            text-transform: none;
            letter-spacing: 0;
        }

        /* Bedenler ve Miktar */
        .pdp-sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 26px;
        }

        .pdp-size-btn {
            min-width: 54px;
            padding: 10px 16px;
            border: 1.5px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            font-weight: 700;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            transition: all .15s ease;
        }

        .pdp-size-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .pdp-size-btn.active {
            background: #fff;
            color: #111;
            border-color: #fff;
        }

        .pdp-qty-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .pdp-qty {
            display: flex;
            align-items: center;
            border: 1.5px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }

        .pdp-qty button {
            width: 40px;
            height: 42px;
            border: none;
            background: #222;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: background .15s;
        }

        .pdp-qty button:hover {
            background: #333;
        }

        .pdp-qty button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .pdp-qty span {
            width: 46px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
        }

        .pdp-stock-note {
            font-size: 12.5px;
            color: #888;
        }

        .pdp-add-btn {
            width: 100%;
            padding: 17px;
            border: none;
            background: #fff;
            color: #111;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .2s ease, transform .1s ease;
        }

        .pdp-add-btn:hover:not(:disabled) {
            background: #ddd;
        }

        .pdp-add-btn:active:not(:disabled) {
            transform: scale(.99);
        }

        .pdp-add-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* Alt Bilgi Akordiyonu */
        .pdp-trust {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin: 28px 0;
            padding: 18px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .pdp-trust-item {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12.5px;
            font-weight: 600;
            color: #ccc;
            flex: 1;
            min-width: 130px;
        }

        .pdp-trust-item svg {
            flex-shrink: 0;
            color: #fff;
        }

        .pdp-accordion-item {
            border-bottom: 1px solid #333;
        }

        .pdp-accordion-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 2px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            user-select: none;
        }

        .pdp-accordion-head .chev {
            transition: transform .25s ease;
            color: #888;
        }

        .pdp-accordion-item.open .pdp-accordion-head .chev {
            transform: rotate(180deg);
        }

        .pdp-accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s ease;
        }

        .pdp-accordion-body p {
            font-size: 13.5px;
            color: #aaa;
            line-height: 1.75;
            padding-bottom: 16px;
        }

        /* Lightbox (Tam Ekran İnceleme) */
        .pdp-lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .95);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .pdp-lightbox-overlay.active {
            opacity: 1;
        }

        .pdp-lb-img {
            max-width: 88vw;
            max-height: 86vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .5);
        }

        .pdp-lb-close,
        .pdp-lb-prev,
        .pdp-lb-next {
            position: absolute;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: background .2s;
        }

        .pdp-lb-close {
            top: 26px;
            right: 32px;
            font-size: 26px;
            width: 44px;
            height: 44px;
            line-height: 1;
        }

        .pdp-lb-prev,
        .pdp-lb-next {
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            width: 52px;
            height: 52px;
        }

        .pdp-lb-close:hover,
        .pdp-lb-prev:hover,
        .pdp-lb-next:hover {
            background: rgba(255, 255, 255, .25);
        }

        .pdp-lb-prev {
            left: 24px;
        }

        .pdp-lb-next {
            right: 24px;
        }

        .pdp-lb-counter {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, .12);
            padding: 7px 16px;
            border-radius: 20px;
        }

        .pdp-skeleton {
            padding: 130px 50px;
            text-align: center;
            color: #666;
        }

        /* Sepet Sidebar Dark Mode Z-index Ezme */
        .sepet-overlay {
            z-index: 99998 !important;
        }

        .sepet-sidebar {
            background-color: #111 !important;
            color: #fff;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.7);
            z-index: 99999 !important;
        }

        .sepet-header {
            border-bottom: 1px solid #333 !important;
        }

        #sepet-kapat {
            color: #fff !important;
        }

        .sepet-footer {
            background-color: #1a1a1a !important;
            border-top: 1px solid #333 !important;
        }

        .sepet-item {
            border-bottom: 1px solid #333 !important;
        }

        .sepet-item-detay p {
            color: #fff !important;
        }

        .adet-kontrol button {
            background-color: #333 !important;
            color: #fff !important;
        }

        .satin-al-btn {
            background-color: #fff !important;
            color: #111 !important;
        }


        /* ============ MOBİL VE RESPONSİVE AYARLAR ============ */
        @media (max-width: 1100px) {
            .pdp-grid {
                grid-template-columns: 72px minmax(0, 1fr);
            }

            .pdp-info {
                grid-column: 1 / -1;
                position: static;
                margin-top: 40px;
                max-width: 560px;
            }
        }

        @media (max-width: 900px) {
            .header-main {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .header-left,
            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .header-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .search-wrapper {
                width: 100%;
                margin-bottom: 5px;
            }

            .header-nav {
                justify-content: flex-start;
                padding: 10px 15px;
                gap: 20px;
            }

            /* Mobilde üst menü çok yer kapladığı için içeriği daha aşağı itiyoruz */
            .pdp-container {
                padding-top: 240px;
                padding-left: 20px;
                padding-right: 20px;
            }

            .pdp-info {
                top: 0;
            }
        }

        @media (max-width: 760px) {
            .pdp-grid {
                grid-template-columns: 1fr;
            }

            .pdp-thumbs {
                order: 2;
                flex-direction: row;
                position: static;
                max-height: none;
                overflow-x: auto;
                width: 100%;
            }

            .pdp-thumbs .pdp-thumb {
                width: 64px;
                height: 64px;
                flex-shrink: 0;
            }

            .pdp-stage {
                order: 1;
            }

            .pdp-info {
                order: 3;
                margin-top: 28px;
            }

            .pdp-title {
                font-size: 24px;
            }

            /* Üst üste binmeleri önlemek için flex-wrap */
            .pdp-qty-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body class="pdp-body">

    <!-- Sepet -->
    <div class="sepet-overlay" id="sepet-overlay"></div>
    <div class="sepet-sidebar" id="sepet-sidebar">
        <div class="sepet-header">
            <h3>Alışveriş Sepeti</h3>
            <button id="sepet-kapat">&times;</button>
        </div>
        <div class="sepet-icerik" id="sepet-icerik">
            <p style="text-align:center;color:#888;margin-top:20px;">Sepetiniz şu an boş.</p>
        </div>
        <div class="sepet-footer">
            <div class="sepet-toplam-kutu">
                <span>Toplam:</span>
                <span id="sepet-toplam-fiyat">0.00 TL</span>
            </div>
            <button class="satin-al-btn"
                onclick="document.getElementById('sepet-sidebar').classList.remove('aktif'); document.getElementById('sepet-overlay').classList.remove('aktif');">Ödeme
                Yap</button>
        </div>
    </div>

    <!-- Siyah Temalı Gelişmiş Header -->
    <header class="babygiz-header">


        <div class="header-main">
            <div class="header-left">
                <a href="index.html" class="logo-feyzay">FEYZAY</a>
            </div>

            <div class="header-right navigation">
                <div class="search-wrapper">
                    <input type="text" class="search-input" id="global-search" placeholder="Ürün ara..."
                        onkeypress="if(event.key === 'Enter') { const v = this.value.trim(); window.location.href = v ? 'urunler.html?search=' + encodeURIComponent(v) : 'urunler.html'; }">
                </div>
                <a href="#" id="sepet-ac-btn">Sepet (0)</a>
                <a href="kayit.html">Giriş Yap</a>
            </div>
        </div>

        <nav class="header-nav">
            <a href="index.html">ANA SAYFA</a>
            <a href="urunler.html">TÜM ÜRÜNLER</a>
            <a href="urunler.html?filter=bandana">BANDANA</a>
            <a href="urunler.html?filter=bere">BERE</a>
            <a href="urunler.html?filter=şapka">ŞAPKA</a>
            <a href="urunler.html?filter=boyunluk">BOYUNLUK</a>
            <a href="urunler.html?filter=t-shirt">T-SHIRT</a>
        </nav>
    </header>

    <div class="pdp-container" id="pdp-container">
        <p class="pdp-skeleton">Ürün yükleniyor...</p>
    </div>

    <script src="assets/js/base.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urunId = urlParams.get('id');
            const container = document.getElementById('pdp-container');

            if (!urunId) {
                container.innerHTML = '<p class="pdp-skeleton">Ürün bulunamadı.</p>';
                return;
            }

            let urun;
            try {
                const res = await fetch('products.json');
                const products = await res.json();
                urun = products.find(p => p.id === urunId);
            } catch (err) {
                container.innerHTML = '<p class="pdp-skeleton">Ürün bilgileri yüklenirken bir hata oluştu.</p>';
                return;
            }

            if (!urun) {
                container.innerHTML = '<p class="pdp-skeleton">Ürün sistemde mevcut değil.</p>';
                return;
            }


            const colorList = (urun.colors && urun.colors.length > 0) ? urun.colors : null;
            let selectedColorIndex = 0;
            const currentColor = () => colorList ? colorList[selectedColorIndex] : null;

            let images = colorList
                ? currentColor().images
                : ((urun.images && urun.images.length > 0) ? urun.images : [urun.image || 'assets/img/no-image.svg']);

            const anaTag = (urun.tags && urun.tags.length > 0) ? urun.tags[0] : null;
            let currentStock = colorList ? currentColor().stock : urun.stock;

            // SEO: ürün bazlı title, meta açıklama, kanonik URL, OG/Twitter etiketleri ve Product yapısal verisi
            const seoImage = images[0];
            const seoUrl = window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(urun.id);
            const seoDesc = (urun.name + " — uygun fiyat, güvenli ödeme ve hızlı kargo ile Feyzay'da.").slice(0, 160);
            document.title = urun.name + ' | Feyzay';
            const setMeta = (selector, value) => {
                let el = document.head.querySelector(selector);
                if (!el) {
                    el = document.createElement('meta');
                    const [, key, val] = selector.match(/\[(name|property)="(.+?)"\]/);
                    el.setAttribute(key, val);
                    document.head.appendChild(el);
                }
                el.setAttribute('content', value);
            };
            setMeta('meta[name="description"]', seoDesc);
            setMeta('meta[property="og:title"]', document.title);
            setMeta('meta[property="og:description"]', seoDesc);
            setMeta('meta[property="og:type"]', 'product');
            setMeta('meta[property="og:url"]', seoUrl);
            if (seoImage) setMeta('meta[property="og:image"]', seoImage);
            setMeta('meta[name="twitter:card"]', 'summary_large_image');
            setMeta('meta[name="twitter:title"]', document.title);
            setMeta('meta[name="twitter:description"]', seoDesc);
            if (seoImage) setMeta('meta[name="twitter:image"]', seoImage);
            let canonical = document.head.querySelector('link[rel="canonical"]');
            if (!canonical) {
                canonical = document.createElement('link');
                canonical.rel = 'canonical';
                document.head.appendChild(canonical);
            }
            canonical.href = seoUrl;
            const stokVarmi = colorList ? colorList.some(c => c.stock > 0) : (urun.stock == null || urun.stock > 0);
            const ldScript = document.createElement('script');
            ldScript.type = 'application/ld+json';
            ldScript.textContent = JSON.stringify({
                '@context': 'https://schema.org',
                '@type': 'Product',
                name: urun.name,
                image: images,
                description: seoDesc,
                sku: urun.id,
                brand: { '@type': 'Brand', name: 'Feyzay' },
                offers: {
                    '@type': 'Offer',
                    url: seoUrl,
                    priceCurrency: 'TRY',
                    price: urun.price,
                    availability: stokVarmi ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock'
                }
            });
            document.head.appendChild(ldScript);

            const thumbsHtml = () => images.map((img, idx) => `
                <button class="pdp-thumb ${idx === 0 ? 'active' : ''}" data-idx="${idx}" aria-label="Görsel ${idx + 1}">
                    <img src="${img}" alt="${urun.name} - görsel ${idx + 1}">
                </button>
            `).join('');

            // MİNİ FOTOĞRAFLI RENK SEÇİMİ ENTEGRASYONU
            const colorsHtml = colorList
                ? colorList.map((c, idx) => {
                    const thumbImg = (c.images && c.images.length > 0) ? c.images[0] : 'assets/img/no-image.svg';
                    return `
                        <button class="pdp-color-swatch ${idx === 0 ? 'active' : ''}" data-idx="${idx}" title="${c.name}" aria-label="${c.name}">
                            <img src="${thumbImg}" alt="${c.name}">
                        </button>
                    `;
                }).join('')
                : '';

            const sizesHtml = (urun.sizes && urun.sizes.length > 0)
                ? urun.sizes.map(size => `<button class="pdp-size-btn" data-size="${size}">${size}</button>`).join('')
                : '';

            const breadcrumbCategory = anaTag
                ? `<a href="urunler.html?filter=${encodeURIComponent(anaTag)}">${anaTag}</a><span class="pdp-sep">/</span>`
                : '';

            container.innerHTML = `
                <div class="pdp-breadcrumb">
                    <a href="index.html">Ana Sayfa</a><span class="pdp-sep">/</span>
                    <a href="urunler.html">Ürünler</a><span class="pdp-sep">/</span>
                    ${breadcrumbCategory}
                    <span class="pdp-current">${urun.name}</span>
                </div>

                <div class="pdp-grid">
                    <div class="pdp-thumbs" id="pdp-thumbs" style="${images.length > 1 ? '' : 'display:none;'}">${thumbsHtml()}</div>

                    <div class="pdp-stage-wrap">
                        <div class="pdp-stage" id="pdp-stage">
                            <span class="pdp-counter-badge" id="pdp-counter" style="${images.length > 1 ? '' : 'display:none;'}">1 / ${images.length}</span>
                            <button class="pdp-expand-btn" id="pdp-expand-btn" type="button" aria-label="Tam ekran görüntüle">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M21 16v3a2 2 0 0 1-2 2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                            </button>
                            <button class="pdp-stage-arrow pdp-stage-prev" id="pdp-stage-prev" type="button" aria-label="Önceki fotoğraf" style="${images.length > 1 ? '' : 'display:none;'}">&#10094;</button>
                            <img src="${images[0]}" id="pdp-main-img" alt="${urun.name}">
                            <button class="pdp-stage-arrow pdp-stage-next" id="pdp-stage-next" type="button" aria-label="Sonraki fotoğraf" style="${images.length > 1 ? '' : 'display:none;'}">&#10095;</button>
                            <span class="pdp-zoom-hint" id="pdp-zoom-hint">🔍 Yakınlaştırmak için üzerine gelin</span>
                        </div>
                    </div>

                    <div class="pdp-info">
                        ${anaTag ? `<a href="urunler.html?filter=${encodeURIComponent(anaTag)}" class="pdp-eyebrow">${anaTag}</a>` : ''}
                        <h1 class="pdp-title">${urun.name}</h1>
                        <p class="pdp-price">${urun.price.toFixed(2)} TL</p>
                        <p class="pdp-sku">Ürün Kodu: ${urun.id}</p>

                        <div class="pdp-stock" id="pdp-stock-badge">
                            <span class="dot"></span>
                            <span id="pdp-stock-text"></span>
                        </div>

                        <div class="pdp-divider"></div>

                        ${colorList ? `
                            <div class="pdp-section-label">Renk Seçin: <span class="pdp-selected-color-label" id="pdp-selected-color-name">${currentColor().name}</span></div>
                            <div class="pdp-colors" id="pdp-colors">${colorsHtml}</div>
                        ` : ''}

                        ${sizesHtml ? `
                            <div class="pdp-section-label">Beden Seçin</div>
                            <div class="pdp-sizes">${sizesHtml}</div>
                        ` : ''}

                        <div class="pdp-section-label">Adet</div>
                        <div class="pdp-qty-row">
                            <div class="pdp-qty">
                                <button id="pdp-qty-minus" type="button" aria-label="Azalt">−</button>
                                <span id="pdp-qty-value">1</span>
                                <button id="pdp-qty-plus" type="button" aria-label="Arttır">+</button>
                            </div>
                            <span class="pdp-stock-note" id="pdp-stock-note"></span>
                        </div>

                        <button id="pdp-add-btn" class="pdp-add-btn">
                            <span id="pdp-add-btn-text">Sepete Ekle</span>
                        </button>

                        <div class="pdp-trust">
                            <div class="pdp-trust-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                                <span>Hızlı Kargo</span>
                            </div>
                            <div class="pdp-trust-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                                <span>Kolay İade</span>
                            </div>
                            <div class="pdp-trust-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <span>Güvenli Ödeme</span>
                            </div>
                        </div>

                        <div class="pdp-accordion" id="pdp-accordion">
                            <div class="pdp-accordion-item">
                                <div class="pdp-accordion-head" data-target="urun-bilgisi">
                                    <span>Ürün Bilgisi</span>
                                    <span class="chev">▾</span>
                                </div>
                                <div class="pdp-accordion-body" id="body-urun-bilgisi">
                                    <p>${urun.description ? urun.description : 'Bu ürüne ait detaylı açıklama yakında eklenecektir. Sorularınız için bizimle iletişime geçebilirsiniz.'}</p>
                                </div>
                            </div>
                            <div class="pdp-accordion-item">
                                <div class="pdp-accordion-head" data-target="kargo-iade">
                                    <span>Kargo &amp; İade</span>
                                    <span class="chev">▾</span>
                                </div>
                                <div class="pdp-accordion-body" id="body-kargo-iade">
                                    <p>Siparişiniz onaylandıktan sonra hazırlanıp kargoya verilir; kargo takip bilgisi hesabınızdaki "Siparişlerim" bölümünden görüntülenebilir. İade koşulları için lütfen mağaza politikamızı inceleyin.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const stage = document.getElementById('pdp-stage');
            const mainImg = document.getElementById('pdp-main-img');
            const zoomHint = document.getElementById('pdp-zoom-hint');
            const counterBadge = document.getElementById('pdp-counter');
            const thumbsContainer = document.getElementById('pdp-thumbs');
            const stagePrevBtn = document.getElementById('pdp-stage-prev');
            const stageNextBtn = document.getElementById('pdp-stage-next');
            let activeIndex = 0;

            const isDesktopHover = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 900px)').matches;
            const ZOOM_SCALE = 2.6;
            let isZoomed = false;

            mainImg.style.willChange = 'transform';

            if (zoomHint) {
                zoomHint.textContent = isDesktopHover ? '🔍 Yakınlaştırmak için üzerine gelin' : '🔍 Yakınlaştırmak için dokunun';
            }

            function resetZoom() {
                isZoomed = false;
                mainImg.style.transition = 'transform .25s ease-out';
                mainImg.style.transform = 'scale(1)';
                stage.classList.remove('is-zoomed');
                if (zoomHint) {
                    zoomHint.style.opacity = '.95';
                    zoomHint.textContent = isDesktopHover ? '🔍 Yakınlaştırmak için üzerine gelin' : '🔍 Yakınlaştırmak için dokunun';
                }
            }

            function zoomAt(x, y) {
                isZoomed = true;
                mainImg.style.transformOrigin = `${x}% ${y}%`;
                mainImg.style.transform = `scale(${ZOOM_SCALE})`;
                stage.classList.add('is-zoomed');
                if (zoomHint) {
                    zoomHint.style.opacity = '0';
                    zoomHint.textContent = isDesktopHover ? '✕ Uzaklaştırmak için ayrılın' : '✕ Uzaklaştırmak için dokunun';
                }
            }

            function getPercentPos(e) {
                const rect = mainImg.getBoundingClientRect();
                const x = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
                const y = Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100));
                return { x, y };
            }

            function bindThumbClicks() {
                thumbsContainer.querySelectorAll('.pdp-thumb').forEach(t => {
                    t.addEventListener('click', () => setActiveImage(Number(t.dataset.idx)));
                });
            }

            function renderThumbs() {
                thumbsContainer.innerHTML = thumbsHtml();
                thumbsContainer.style.display = images.length > 1 ? '' : 'none';
                bindThumbClicks();
            }

            function updateStageArrows() {
                const cokFotoVar = images.length > 1;
                if (stagePrevBtn) stagePrevBtn.style.display = cokFotoVar ? '' : 'none';
                if (stageNextBtn) stageNextBtn.style.display = cokFotoVar ? '' : 'none';
            }

            function setActiveImage(idx) {
                activeIndex = idx;
                mainImg.style.transition = 'none';
                mainImg.src = images[idx];
                resetZoom();
                if (counterBadge) {
                    counterBadge.style.display = images.length > 1 ? '' : 'none';
                    counterBadge.textContent = `${idx + 1} / ${images.length}`;
                }
                thumbsContainer.querySelectorAll('.pdp-thumb').forEach(t => t.classList.toggle('active', Number(t.dataset.idx) === idx));
                updateStageArrows();
            }

            bindThumbClicks();
            updateStageArrows();

            function gotoPrevImage() { setActiveImage((activeIndex - 1 + images.length) % images.length); }
            function gotoNextImage() { setActiveImage((activeIndex + 1) % images.length); }

            if (stagePrevBtn) stagePrevBtn.addEventListener('click', (e) => { e.stopPropagation(); gotoPrevImage(); });
            if (stageNextBtn) stageNextBtn.addEventListener('click', (e) => { e.stopPropagation(); gotoNextImage(); });

            stage.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') gotoPrevImage();
                else if (e.key === 'ArrowRight') gotoNextImage();
            });

            if (isDesktopHover) {
                // Masaüstünde: fareyi fotoğrafın üzerine getirir getirmez, tıklamaya gerek kalmadan
                // yakınlaştırma başlar ve imleci akıcı biçimde takip eder (mercek/lup efekti).
                stage.addEventListener('mouseenter', (e) => {
                    mainImg.style.transition = 'transform .2s ease-out';
                    const { x, y } = getPercentPos(e);
                    zoomAt(x, y);
                });
                stage.addEventListener('mousemove', (e) => {
                    if (!isZoomed) return;
                    mainImg.style.transition = 'none';
                    const { x, y } = getPercentPos(e);
                    mainImg.style.transformOrigin = `${x}% ${y}%`;
                });
                stage.addEventListener('mouseleave', () => resetZoom());
            } else {
                // Mobil/dokunmatik: dokununca yakınlaştırır, tekrar dokununca eski hâline döner.
                stage.addEventListener('click', (e) => {
                    if (e.target === stagePrevBtn || e.target === stageNextBtn) return;
                    const { x, y } = getPercentPos(e);
                    if (!isZoomed) {
                        mainImg.style.transition = 'transform .2s ease-out';
                        zoomAt(x, y);
                    } else {
                        resetZoom();
                    }
                });
            }


            function openLightboxGallery(startIdx) {
                let idx = startIdx;
                const overlay = document.createElement('div');
                overlay.className = 'pdp-lightbox-overlay';
                overlay.innerHTML = `
                    <button class="pdp-lb-close" aria-label="Kapat">&times;</button>
                    ${images.length > 1 ? '<button class="pdp-lb-prev" aria-label="Önceki görsel">&#10094;</button>' : ''}
                    <img class="pdp-lb-img" src="${images[idx]}" alt="${urun.name}">
                    ${images.length > 1 ? '<button class="pdp-lb-next" aria-label="Sonraki görsel">&#10095;</button>' : ''}
                    ${images.length > 1 ? `<div class="pdp-lb-counter">${idx + 1} /${images.length}</div>` : ''}
                `;
                document.body.appendChild(overlay);
                requestAnimationFrame(() => overlay.classList.add('active'));

                const imgEl = overlay.querySelector('.pdp-lb-img');
                const counterEl = overlay.querySelector('.pdp-lb-counter');

                const update = () => {
                    imgEl.src = images[idx];
                    if (counterEl) counterEl.textContent = `${idx + 1} / ${images.length}`;
                    setActiveImage(idx);
                };

                const close = () => {
                    overlay.classList.remove('active');
                    document.removeEventListener('keydown', keyHandler);
                    setTimeout(() => overlay.remove(), 220);
                };
                const next = (e) => { if (e) e.stopPropagation(); idx = (idx + 1) % images.length; update(); };
                const prev = (e) => { if (e) e.stopPropagation(); idx = (idx - 1 + images.length) % images.length; update(); };
                const keyHandler = (e) => {
                    if (e.key === 'Escape') close();
                    else if (e.key === 'ArrowRight') next();
                    else if (e.key === 'ArrowLeft') prev();
                };
                document.addEventListener('keydown', keyHandler);

                overlay.querySelector('.pdp-lb-close').onclick = close;
                overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
                const prevBtn = overlay.querySelector('.pdp-lb-prev');
                const nextBtn = overlay.querySelector('.pdp-lb-next');
                if (prevBtn) prevBtn.onclick = prev;
                if (nextBtn) nextBtn.onclick = next;
            }

            const expandBtn = document.getElementById('pdp-expand-btn');
            if (expandBtn) {
                expandBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightboxGallery(activeIndex);
                });
            }


            const stockBadge = document.getElementById('pdp-stock-badge');
            const stockText = document.getElementById('pdp-stock-text');
            const stockNote = document.getElementById('pdp-stock-note');
            const addBtn = document.getElementById('pdp-add-btn');
            const addBtnText = document.getElementById('pdp-add-btn-text');
            const qtyValueEl = document.getElementById('pdp-qty-value');
            const qtyMinusBtn = document.getElementById('pdp-qty-minus');
            const qtyPlusBtn = document.getElementById('pdp-qty-plus');
            let selectedQty = 1;
            let maxQty = 0;

            function refreshQtyBtns() {
                qtyValueEl.textContent = selectedQty;
                qtyMinusBtn.disabled = selectedQty <= 1;
                qtyPlusBtn.disabled = selectedQty >= maxQty;
            }

            function refreshStockUI() {
                const stokVar = currentStock > 0;
                maxQty = stokVar ? currentStock : 0;
                selectedQty = stokVar ? 1 : 0;

                stockBadge.classList.toggle('in', stokVar);
                stockBadge.classList.toggle('out', !stokVar);
                stockText.textContent = stokVar ? `Stokta Var · ${currentStock} adet` : 'Tükendi';
                stockNote.textContent = stokVar ? `en fazla ${currentStock} adet ekleyebilirsiniz` : '';

                addBtn.disabled = !stokVar;
                addBtnText.textContent = stokVar ? 'Sepete Ekle' : 'Stokta Yok';

                if (qtyMinusBtn && qtyPlusBtn) refreshQtyBtns();
            }

            if (qtyMinusBtn && qtyPlusBtn) {
                qtyMinusBtn.onclick = () => { if (selectedQty > 1) { selectedQty--; refreshQtyBtns(); } };
                qtyPlusBtn.onclick = () => { if (selectedQty < maxQty) { selectedQty++; refreshQtyBtns(); } };
            }

            refreshStockUI();


            if (colorList) {
                const colorsContainer = document.getElementById('pdp-colors');
                const selectedColorNameEl = document.getElementById('pdp-selected-color-name');

                colorsContainer.querySelectorAll('.pdp-color-swatch').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedColorIndex = Number(btn.dataset.idx);
                        const c = currentColor();

                        images = c.images;
                        currentStock = c.stock;

                        colorsContainer.querySelectorAll('.pdp-color-swatch').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        if (selectedColorNameEl) selectedColorNameEl.textContent = c.name;

                        renderThumbs();
                        setActiveImage(0);
                        refreshStockUI();
                    });
                });
            }


            const sizeBtns = document.querySelectorAll('.pdp-size-btn');
            sizeBtns.forEach(btn => {
                btn.onclick = () => {
                    sizeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
            });


            if (addBtn) {
                addBtn.onclick = () => {
                    if (currentStock <= 0) return;

                    const selectedSizeBtn = document.querySelector('.pdp-size-btn.active');
                    if (urun.sizes && urun.sizes.length > 0 && !selectedSizeBtn) {
                        return window.showToast('Lütfen bir beden seçimi yapın!', 'error');
                    }

                    let sepet = JSON.parse(localStorage.getItem('feyzay_sepet')) || [];
                    const secilenBeden = selectedSizeBtn ? selectedSizeBtn.getAttribute('data-size') : 'Standart';
                    const secilenRenk = colorList ? currentColor().name : null;

                    const mevcutUrun = sepet.find(u => u.id === urun.id && u.beden === secilenBeden && (u.renk || null) === secilenRenk);
                    if (mevcutUrun) {
                        mevcutUrun.adet += selectedQty;
                    } else {
                        sepet.push({
                            id: urun.id,
                            isim: urun.name,
                            fiyat: urun.price,
                            resim: images[0],
                            adet: selectedQty,
                            beden: secilenBeden,
                            renk: secilenRenk
                        });
                    }

                    localStorage.setItem('feyzay_sepet', JSON.stringify(sepet));
                    window.showToast('Ürün sepete eklendi!');
                    if (window.feyzay_sepetiGuncelle) window.feyzay_sepetiGuncelle();

                    const originalText = addBtnText.textContent;
                    addBtnText.textContent = '✓ Sepete Eklendi';
                    addBtn.disabled = true;
                    setTimeout(() => {
                        addBtnText.textContent = originalText;
                        addBtn.disabled = currentStock <= 0;
                    }, 1200);
                };
            }


            document.querySelectorAll('.pdp-accordion-head').forEach(head => {
                head.addEventListener('click', () => {
                    const item = head.parentElement;
                    const body = head.nextElementSibling;
                    const isOpen = item.classList.contains('open');
                    if (isOpen) {
                        body.style.maxHeight = null;
                        item.classList.remove('open');
                    } else {
                        item.classList.add('open');
                        body.style.maxHeight = body.scrollHeight + 'px';
                    }
                });
            });
        });
    </script>
</body>
